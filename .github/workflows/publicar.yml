name: Publicar instaladores
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reunir e conferir instaladores
        run: |
          cd atualizacao-1.0.7
          cat Recanto-das-Asas-1.0.7-Windows.exe.part* > Recanto-das-Asas-1.0.7-Windows.exe
          cat Recanto-das-Asas-1.0.7-Android.apk.part* > Recanto-das-Asas-1.0.7-Android.apk
          sha256sum -c SHA256SUMS.txt
      - name: Anexar pacotes completos
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.7 atualizacao-1.0.7/Recanto-das-Asas-1.0.7-Windows.exe atualizacao-1.0.7/Recanto-das-Asas-1.0.7-Android.apk atualizacao-1.0.7/SHA256SUMS.txt
      - name: Disponibilizar release verificada
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v1.0.7 --draft=false --latest
